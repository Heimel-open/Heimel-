name: Reference hash preflight

on:
  push:
    branches:
      - reference/v0.2.0-adapter

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Hash new public payload
        run: |
          sha256sum reference/adapter.py reference/test_adapter.py conformance/receipts/reference-v0.2.0.json
