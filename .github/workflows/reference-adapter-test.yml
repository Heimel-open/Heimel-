name: Reference adapter TDD

on:
  push:
    branches:
      - reference/v0.2.0-adapter

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Unit-test reference adapter
        run: python reference/test_adapter.py
      - name: Run full v0.2.0 conformance suite
        run: |
          python conformance/run_conformance.py \
            --adapter "python reference/adapter.py" \
            --implementation "heimel-public-reference-adapter/0.2.0" \
            --configuration-digest "dce8fdff9757e9092583d45b7d3a8f2b139532d838332fcc974e84a971e4a870" \
            --output /tmp/reference-conformance.json
          cat /tmp/reference-conformance.json
